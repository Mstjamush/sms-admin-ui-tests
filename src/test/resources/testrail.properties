# ---- TestRail ----
# TestRail instance base URL (no trailing slash, no /index.php).
testrail.url=https://YOUR_INSTANCE.testrail.io
# TestRail login email.
testrail.username=your.email@company.com
# TestRail -> avatar (top right) -> My Settings -> API Keys -> Add Key.
testrail.api_key=your_testrail_api_key_here
# TestRail project ID (from the project's URL, e.g. /projects/overview/3 -> 3).
testrail.project_id=1
# Only required if the project uses multiple test suites (suite mode 2/3).
# Leave blank for single-suite-mode projects.
testrail.suite_id=
# Used by plain "mvn test" runs (TestRailHooks posts results here). Create a
# run in TestRail containing the cases tagged @C<id> below and paste its id
# (from the run's URL, e.g. /runs/view/456 -> 456). Not used by the
# TestRail-driven pipeline (TestRailDrivenRunner) - that creates its own run
# each time from testrail.project_id/testrail.suite_id.
testrail.run_id=

# ---- sms-admin-ui / bulksms-api ----
# Base URL of the running Vite dev server (npm run dev).
ui.base.url=http://localhost:5173
# Base URL of the running bulksms-api backend - used both by sms-admin-ui
# itself (its own VITE_API_BASE_URL) and by this suite's AdminFixtures to
# seed clients/users/senders directly via the API before driving the UI.
api.base.url=http://localhost:8000

# Bootstrap Super Administrator created by `python seed_admin.py` in
# bulksms-api. These are that script's fixed defaults - change here if you've
# since changed the account's password.
admin.super_admin.email=admin@bulksms-platform.com
admin.super_admin.password=ChangeMe123!

# ---- Browser ----
# "true" runs Chrome headless (default, CI-friendly); "false" shows the
# browser window - useful while writing/debugging a scenario.
browser.headless=true
